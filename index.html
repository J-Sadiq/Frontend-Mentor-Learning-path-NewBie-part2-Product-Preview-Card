<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Product Preview Card</title>
  </head>
  <body>
    <article class="product-card">
      <section id="left">
        <figure></figure>
      </section>
      <section id="right">
        <header>
          <p class="product-category">PERFUME</p>
          <h1 id="product-title">Gabrielle Essence Eau De Parfum</h1>
        </header>
        <p class="product-description">
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the Hause of CHANEL
        </p>
        <p class="product-price">
          <data value="149.99" class="current-price">$149.99</data>

          <data value="169.99" class="last-price">$169.99</data>
        </p>
        <button class="btn">
          <div>
            <img src="images/icon-cart.svg" alt="Cart-Icon" />
            <span>Add To Cart</span>
          </div>
        </button>
      </section>
    </article>
  </body>
</html>
